name: theos_logos_mobile
description: A Flutter audio player application for Theos Logos content
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Audio player
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  
  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.0
  
  # HTTP requests
  http: ^1.1.0
  
  # File handling
  path_provider: ^2.1.1
  
  # TOML parsing
  toml: ^0.15.0
  
  # Shared preferences for storing state
  shared_preferences: ^2.2.2
  
  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
